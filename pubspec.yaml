name: lamma
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  url_launcher: ^6.3.1
  provider: ^6.1.2
  wakelock_plus: ^1.8.1
  image_picker: ^1.2.4
  app_settings: ^9.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/characters/
    - assets/splash/

  # Thmanyah: licensed, so the files are NOT in git (see assets/fonts/README.md)
  fonts:
    - family: Thmanyah
      fonts:
        - asset: assets/fonts/thmanyah/thmanyahsans/otf/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyah/thmanyahsans/otf/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyah/thmanyahsans/otf/thmanyahsans-Bold.otf
          weight: 700
